name: women_safety_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase dependencies
  firebase_core: ^3.4.1                  # Required for initializing Firebase
  firebase_auth: ^5.2.1                  # Used for authentication
  cloud_firestore: ^5.4.1                # Firestore for real-time database

  firebase_messaging: ^15.1.1            # For push notifications
  firebase_storage: ^12.3.0              # Firebase Storage for storing media files

  # Location-based packages
  location: ^7.0.0                       # Location fetching for real-time GPS location
  location_web: ^5.0.3                   # Web location support (only needed if targeting web)
  flutter_map: ^7.0.2                    # OpenStreetMap integration for maps
  latlong2: ^0.9.1                       # For handling LatLng (coordinates for maps)
  geofence_flutter: ^2.0.0               # For geofencing functionality
  map_launcher: ^3.5.0                   # Launch external map apps with location data
  flutter_map_location_marker: ^9.1.1    # Display a marker for the user's current location on the map
  geocoding: ^3.0.0                      # Convert addresses to coordinates and vice versa

  # Notifications
  flutter_local_notifications: ^17.2.2   # Local notifications, integrates with Firebase for push notifications

  # SMS Functionality

  telephony: ^0.2.0                      # Send and listen for incoming SMS
  flutter_sms_listener: ^0.1.3           # To listen to incoming SMS

  # Audio for Siren Sound
  audioplayers: ^6.1.0                   # For playing audio like the siren sound

  # Map and location
  flutter_osm_plugin: ^1.3.1             # OSM (OpenStreetMap) plugin for displaying maps

  # Utility and other packages
  shared_preferences: ^2.3.2             # For storing small amounts of user data
  material: ^1.0.0+2                     # Material Design components

  # State management
  provider: ^6.1.2                       # For state management (used across app screens and services)

  # HTTP Requests
  http: ^1.2.2                           # For making HTTP API requests

  # Icons
  cupertino_icons: ^1.0.6                # iOS-style icons for Cupertino widgets

dev_dependencies:
  flutter_test:
    sdk: flutter                         # Testing framework for Flutter apps

dependency_overrides:
  web: ^1.0.0                            # Ensure web dependency compatibility
  geolocator: ^13.0.1                    # For getting the device's current location
  flutter_compass: ^0.8.0                # Compass functionality using the device sensors
  flutter_sms: ^2.3.3                    # For sending SMS using the device's SIMs

  flutter_lints: ^3.0.0                  # Linting rules for ensuring code quality

flutter:
  uses-material-design: true

  assets:
    - assets/siren.mp3                   # The siren sound file used for the emergency feature
